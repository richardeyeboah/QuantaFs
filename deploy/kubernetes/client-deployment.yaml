apiVersion: apps/v1
kind: Deployment
metadata:
  name: quantafs-client
  namespace: quantafs-local
  labels:
    app.kubernetes.io/name: quantafs
    app.kubernetes.io/component: client
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: quantafs
      app.kubernetes.io/component: client
  template:
    metadata:
      labels:
        app.kubernetes.io/name: quantafs
        app.kubernetes.io/component: client
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: client
          image: quantafs:stage3
          imagePullPolicy: Never
          command:
            - /bin/sh
            - -ec
          args:
            - |
              trap 'exit 0' TERM INT
              while true; do
                sleep 3600 &
                wait $!
              done
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms16m -Xmx64m"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: client-session
              mountPath: /var/lib/quantafs-client
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: client-session
          persistentVolumeClaim:
            claimName: quantafs-client-session
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
