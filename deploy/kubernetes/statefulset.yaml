apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: quantafs
  namespace: quantafs-local
  labels:
    app.kubernetes.io/name: quantafs
    app.kubernetes.io/component: server
spec:
  serviceName: quantafs-peer
  replicas: 3
  podManagementPolicy: Parallel
  updateStrategy:
    type: OnDelete
  selector:
    matchLabels:
      app.kubernetes.io/name: quantafs
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: quantafs
        app.kubernetes.io/component: server
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: quantafs
          image: quantafs:stage3
          imagePullPolicy: Never
          command:
            - /bin/sh
            - -ec
          args:
            - |
              exec java -Xms64m -Xmx512m -XX:+ExitOnOutOfMemoryError -jar /opt/quantafs/quantafs.jar cluster-server \
                --id "${POD_NAME}" \
                --peers "quantafs-0=quantafs-0.quantafs-peer:7000,quantafs-1=quantafs-1.quantafs-peer:7000,quantafs-2=quantafs-2.quantafs-peer:7000" \
                --data-dir /var/lib/quantafs \
                --network-mode kubernetes
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - name: grpc
              containerPort: 7000
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          startupProbe:
            exec:
              command:
                - java
                - -Xms16m
                - -Xmx64m
                - -jar
                - /opt/quantafs/quantafs.jar
                - cluster-status
                - --target
                - 127.0.0.1:7000
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 18
          readinessProbe:
            exec:
              command:
                - java
                - -Xms16m
                - -Xmx64m
                - -jar
                - /opt/quantafs/quantafs.jar
                - cluster-status
                - --target
                - 127.0.0.1:7000
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 2
            successThreshold: 1
          livenessProbe:
            exec:
              command:
                - java
                - -Xms16m
                - -Xmx64m
                - -jar
                - /opt/quantafs/quantafs.jar
                - cluster-status
                - --target
                - 127.0.0.1:7000
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/quantafs
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: quantafs
          app.kubernetes.io/component: server
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 2Gi
