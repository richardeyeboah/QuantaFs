apiVersion: v1
kind: Service
metadata:
  name: quantafs-peer
  namespace: quantafs-local
  labels:
    app.kubernetes.io/name: quantafs
    app.kubernetes.io/component: server
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: quantafs
    app.kubernetes.io/component: server
  ports:
    - name: grpc
      port: 7000
      targetPort: grpc
      protocol: TCP
